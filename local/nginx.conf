# Локальная копия схемы с сервера (см. infra/default).
# Пути /var/www/kittygram/ заменены на local/www/, порт 8081 вместо 80.
# __ROOT__ подставляет скрипт local/start.sh.
worker_processes 1;
pid __ROOT__/local/run/nginx.pid;
error_log __ROOT__/local/run/error.log;

events {}

http {
    include __NGINX_PREFIX__/mime.types;
    access_log __ROOT__/local/run/access.log;
    client_body_temp_path __ROOT__/local/run/body;
    proxy_temp_path __ROOT__/local/run/proxy;

    server {
        listen 8081;
        server_name localhost;
        server_tokens off;

        location /api/ {
            client_max_body_size 20M;
            proxy_set_header Host $http_host;
            proxy_pass http://127.0.0.1:8080;
        }

        location /admin/ {
            client_max_body_size 20M;
            proxy_set_header Host $http_host;
            proxy_pass http://127.0.0.1:8080;
        }

        location /media/ {
            alias __ROOT__/local/www/media/;
        }

        location /static_backend/ {
            alias __ROOT__/local/www/static_backend/;
        }

        location / {
            root __ROOT__/local/www;
            index index.html index.htm;
            try_files $uri /index.html;
        }
    }
}
